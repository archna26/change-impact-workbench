[pytest]
# Default run excludes the 'demo' marker.
# The incomplete-change scenario intentionally produces failing tests
# to demonstrate the hidden dependencies found by the workbench.
# Run those separately with:
#   python -m pytest -m demo tests/test_incomplete_change.py -v
addopts = -m "not demo"
markers =
    demo: Intentional failure scenario — runs the broken pre-fix state to demonstrate hidden dependency impact. Must NOT be included in the default green suite.
